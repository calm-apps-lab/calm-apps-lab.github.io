<style>
/* Sudoku Pause: calm paper look, big readable type (Lexend was designed for easier reading; its zero has no slash, unlike Atkinson) */
:root {
  --scale: 1;
  --bg: #f6f1e7;
  --surface: #fffdf8;
  --surface-2: #efe8da;
  --ink: #1f2a37;
  --ink-2: #4b5563;
  --ink-3: #8a8f98;
  --line: #d9d0bf;
  --line-strong: #2b3644;
  --accent: #2f6f6a;
  --accent-ink: #ffffff;
  --accent-soft: #d6ebe7;
  --sel: #bfe0da;
  --peer: #ebe3d3;
  --same: #a9d3cb;
  --given: #1f2a37;
  --entered: #2f5fa8;
  --bad: #c2413b;
  --bad-soft: #f6d9d6;
  --gold: #c08a1e;
  --gold-soft: #f7ebcf;
  --plus: #7a4fb0;
  --plus-soft: #ece3f7;
  --plus-ink: #ffffff;
  --fill: #24303f;
  --cross: #9aa1ab;
  --shadow: 0 1px 2px rgba(31, 42, 55, .06), 0 4px 14px rgba(31, 42, 55, .06);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #161b22;
  --surface: #1f262f;
  --surface-2: #28303a;
  --ink: #eef1f4;
  --ink-2: #b8c0ca;
  --ink-3: #7d8794;
  --line: #4a5563;
  --line-strong: #c9d1da;
  --accent: #5fb5aa;
  --accent-ink: #0f1a19;
  --accent-soft: #23403d;
  --sel: #2f5852;
  --peer: #252d37;
  --same: #3a6b64;
  --given: #eef1f4;
  --entered: #8db8ff;
  --bad: #ff7b72;
  --bad-soft: #4a2523;
  --gold: #e3b341;
  --gold-soft: #3b3220;
  --plus: #b794e6;
  --plus-soft: #33294a;
  --plus-ink: #1a1230;
  --fill: #e6eaee;
  --cross: #6b7480;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* extra themes: high contrast is free (accessibility), sage and night are part of Plus */
:root[data-theme="contrast"] {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #eeeeee; --ink: #000000; --ink-2: #1a1a1a; --ink-3: #3d3d3d;
  --line: #8a8a8a; --line-strong: #000000; --accent: #0b5d56; --accent-ink: #ffffff; --accent-soft: #cfe9e5;
  --sel: #9fd8cf; --peer: #e6e6e6; --same: #7cc7bb; --given: #000000; --entered: #0039a6; --bad: #b00020; --bad-soft: #ffd6dc;
  --fill: #000000; --cross: #555555; --shadow: 0 0 0 1px #000;
}
:root[data-theme="sage"] {
  --bg: #eef2ea; --surface: #fbfcf8; --surface-2: #e2e9dc; --ink: #22301f; --ink-2: #4a5a45; --ink-3: #7d8c78;
  --line: #cdd8c6; --line-strong: #2f3f2b; --accent: #5a7f4e; --accent-ink: #ffffff; --accent-soft: #dce9d4;
  --sel: #c6dcbb; --peer: #e7eee1; --same: #b5d1a8; --given: #22301f; --entered: #7a5a2f; --fill: #2f3f2b;
}
:root[data-theme="night"] {
  --bg: #0f1630; --surface: #18213f; --surface-2: #222c50; --ink: #f2ecdc; --ink-2: #c3bfd6; --ink-3: #8a88a8;
  --line: #34406a; --line-strong: #d9cfae; --accent: #e3b45c; --accent-ink: #1a1405; --accent-soft: #3a3622;
  --sel: #4a4426; --peer: #1f2848; --same: #5c5430; --given: #f2ecdc; --entered: #9cc4ff; --bad: #ff8a80; --bad-soft: #4a2426;
  --gold: #e3b45c; --gold-soft: #3a3320; --plus: #c7a6f0; --plus-soft: #2e2850; --plus-ink: #1a1230; --fill: #f2ecdc; --cross: #6f7798;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(17px * var(--scale)); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Lexend', system-ui, 'Hiragino Sans', 'Noto Sans JP', -apple-system, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.4; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
.hidden { display: none !important; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.scroll { flex: 1; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; color: var(--ink-3); font-size: .78rem; font-weight: 700; border-radius: 12px; }
.tab svg { width: 26px; height: 26px; }
/* tab labels follow the screen width, not the text size setting, so long words (Головоломки) still fit */
.tab span { font-size: min(.78rem, 3.2vw); max-width: 100%; overflow-wrap: anywhere; text-align: center; line-height: 1.15; }
.tab.on { color: var(--accent); }

/* headings */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.top .brand { flex-shrink: 0; }
.top .chip { white-space: normal; min-width: 0; line-height: 1.2; padding-block: 6px; }
.brand { white-space: nowrap; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.date { font-size: 1.7rem; font-weight: 700; }
.sub { color: var(--ink-2); }
.section-title { scroll-margin-top: calc(12px + env(safe-area-inset-top, 0px)); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 6px 2px -6px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-weight: 700; white-space: nowrap; }
.chip svg { width: 20px; height: 20px; }

.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }

/* daily set */
.daily { display: flex; flex-direction: column; gap: 10px; }
.dtile { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: var(--surface-2); text-align: left; min-height: 76px; width: 100%; }
.dtile .ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--accent); }
.dtile .ico svg { width: 34px; height: 34px; }
.dtile .t { font-weight: 700; font-size: 1.08rem; }
.dtile .m { color: var(--ink-2); font-size: .9rem; }
.dtile .st { font-weight: 700; color: var(--ink-3); font-size: .9rem; display: flex; align-items: center; gap: 6px; }
.dtile.done .ico { background: var(--accent); color: var(--accent-ink); }
.dtile.done .st { color: var(--accent); }
.dtile .st svg { width: 26px; height: 26px; }
.dtile .go { color: var(--accent); }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { font-size: .78rem; color: var(--ink-3); font-weight: 700; }
.week .dot { margin: 4px auto 0; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--ink-3); }
.week .dot.part { border-color: var(--accent); color: var(--accent); }
.week .dot.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week .d.we { color: var(--ink); }
.week .dot.we:not(.full) { background: var(--surface-2); }
.week .dot.today { outline: 2px solid var(--ink); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 1.05rem; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.plus { background: var(--plus); color: var(--plus-ink); }
.btn.wide { width: 100%; }
.btn svg { width: 22px; height: 22px; }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 4px; min-height: 60px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; }
.row .m { color: var(--ink-2); font-size: .9rem; }
.row .r { color: var(--ink-3); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.row .r svg { width: 22px; height: 22px; }
.row .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); flex: none; }
.row .ico svg { width: 28px; height: 28px; }
.lvl { display: flex; gap: 3px; }
.lvl i { width: 8px; height: 18px; border-radius: 3px; background: var(--line); }
.lvl i.on { background: var(--accent); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--plus-soft); color: var(--plus); vertical-align: middle; }
.badge.test { background: var(--gold-soft); color: var(--gold); }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.gitem { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.gitem canvas { width: 70%; height: 70%; image-rendering: pixelated; }
.gitem .q { font-size: 1.6rem; font-weight: 700; color: var(--ink-3); }
.gitem .sz { position: absolute; left: 6px; bottom: 4px; font-size: .7rem; font-weight: 700; color: var(--ink-3); }
.gitem .lock { position: absolute; right: 6px; top: 6px; }

/* plus promo */
.promo { display: flex; gap: 14px; align-items: center; background: var(--plus-soft); border-radius: 18px; padding: 16px; text-align: left; width: 100%; }
.promo svg { width: 40px; height: 40px; color: var(--plus); flex: none; }
.promo .t { font-weight: 700; color: var(--plus); }
.promo .m { color: var(--ink-2); font-size: .92rem; }

/* settings */
.set { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; min-height: 60px; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.set .t { font-weight: 700; }
.set .m { color: var(--ink-2); font-size: .88rem; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; flex-wrap: nowrap; }
.seg.wrap { flex-wrap: wrap; }
.seg button { min-height: 44px; min-width: 44px; padding: 6px 12px; border-radius: 10px; font-weight: 700; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; width: 56px; height: 34px; border-radius: 17px; background: var(--line); flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(22px); }

/* game screen */
.game { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.gtop { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px; min-height: 52px; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); }
.icon-btn svg { width: 28px; height: 28px; }
.gtitle { font-weight: 700; font-size: 1.05rem; line-height: 1.2; text-align: center; min-width: 0; overflow-wrap: anywhere; }
.gtitle small { display: block; font-weight: 400; color: var(--ink-3); font-size: .82rem; }
.timer { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink-2); min-height: 48px; padding: 0 6px; border-radius: 12px; }
.timer svg { width: 22px; height: 22px; }
.gbody { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 8px 0; }
.msg { min-height: 3.2em; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--ink); font-size: .98rem; display: flex; align-items: center; gap: 10px; }
.msg.empty { background: transparent; }
.msg .act { margin-left: auto; flex: none; }
.msg .btn { min-height: 44px; padding: 8px 14px; font-size: .95rem; }

/* sudoku board */
.sboard { display: grid; width: 100%; aspect-ratio: 1; max-width: 100%; border: 3px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: var(--surface); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.scell { min-width: 0; min-height: 0; overflow: hidden; position: relative; display: grid; place-items: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: calc(min(8.4vw, 44px) * var(--scale-board, 1)); font-weight: 700; color: var(--entered); background: var(--surface); }
.sboard.n6 .scell { font-size: calc(min(11vw, 58px)); }
.scell.given { color: var(--given); }
.scell.br { border-right: 2px solid var(--line-strong); }
.scell.bb { border-bottom: 2px solid var(--line-strong); }
.scell.lastc { border-right: 0; }
.scell.lastr { border-bottom: 0; }
.scell.peer { background: var(--peer); }
.scell.same { background: var(--same); }
.scell.sel { background: var(--sel); }
.scell.bad { color: var(--bad); background: var(--bad-soft); }
.scell.hint { box-shadow: inset 0 0 0 3px var(--gold); }
.scell.hunit { background: var(--gold-soft); }
.scell.wave { animation: wave .5s ease both; }
@keyframes wave { 40% { transform: scale(1.12); background: var(--accent-soft); } }
.notes { position: absolute; inset: 1px; line-height: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-size: calc(min(3.3vw, 16px)); font-weight: 700; color: var(--ink-2); }
.sboard.n6 .notes { grid-template-rows: repeat(2, 1fr); font-size: calc(min(3.6vw, 17px)); }
.notes span { display: grid; place-items: center; min-height: 0; line-height: 1; }
.notes span.same { color: var(--accent); }

.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 60px; padding: 6px 2px; border-radius: 14px; color: var(--ink-2); font-size: min(.8rem, 3.4vw); font-weight: 700; position: relative; min-width: 0; overflow-wrap: anywhere; text-align: center; }
.tool svg { width: 28px; height: 28px; }
.tool.on { background: var(--accent-soft); color: var(--accent); }
.tool .cnt { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; display: grid; place-items: center; }
.tool .cnt.ad { background: var(--gold); color: #fff; }
.pad { display: grid; gap: 6px; }
.pad.n9 { grid-template-columns: repeat(9, 1fr); }
.pad.n6 { grid-template-columns: repeat(6, 1fr); }
.pad.two.n9 { grid-template-columns: repeat(5, 1fr); }
.key { min-height: 64px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 1.9rem; font-weight: 700; color: var(--entered); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.key small { font-size: .7rem; color: var(--ink-3); margin-top: 4px; font-weight: 700; }
.key.used { opacity: .3; }
.key.notes-mode { color: var(--ink-2); }

/* picture board */
.pwrap { display: grid; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.pclue-col, .pclue-row { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.pclue-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 1px; padding-bottom: 4px; line-height: 1.05; }
.pclue-row { display: flex; justify-content: flex-end; align-items: center; gap: 5px; padding-right: 6px; }
.pclue-col.ok, .pclue-row.ok { color: var(--ink-3); opacity: .55; }
.pclue-col.cur, .pclue-row.cur { background: var(--accent-soft); border-radius: 6px; }
.pclue-col.hl, .pclue-row.hl { background: var(--gold-soft); border-radius: 6px; }
.pgrid { display: grid; border: 3px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
.pcell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; background: var(--surface); }
.pcell.c5 { border-right: 2px solid var(--line-strong); }
.pcell.r5 { border-bottom: 2px solid var(--line-strong); }
.pcell.cur { background: var(--peer); }
.pcell.f { background: var(--fill); }
.pcell.x::before, .pcell.x::after { content: ''; position: absolute; left: 22%; right: 22%; top: 50%; height: 2px; background: var(--cross); border-radius: 1px; transform: rotate(45deg); }
.pcell.x::after { transform: rotate(-45deg); }
.pcell.bad::before, .pcell.bad::after { background: var(--bad); }
.pcell.hint { box-shadow: inset 0 0 0 3px var(--gold); }
.pcell.reveal { transition: background .5s; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--surface-2); padding: 4px; border-radius: 16px; }
.mode { min-height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; color: var(--ink-2); }
.mode.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.mode .sw { width: 24px; height: 24px; border-radius: 5px; background: var(--fill); }
.mode .sw.x { background: none; position: relative; border: 2px solid var(--line); }
.mode .sw.x::before, .mode .sw.x::after { content: ''; position: absolute; left: 2px; right: 2px; top: 9px; height: 2px; background: var(--cross); transform: rotate(45deg); }
.mode .sw.x::after { transform: rotate(-45deg); }

/* ads (test placeholders) */
.adbar { min-height: 56px; border: 2px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink-3); font-size: .85rem; text-align: center; padding: 6px 10px; }
.adbar button { color: var(--plus); font-weight: 700; text-decoration: underline; min-height: 44px; }

/* sheets and overlays */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 28, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .22s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 1.5rem; }
.sheet .center { text-align: center; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats3 b { display: block; font-size: 1.4rem; }
.stats3 span { color: var(--ink-3); font-size: .82rem; font-weight: 700; }
.reveal-pic { display: grid; place-items: center; }
.reveal-pic canvas { width: 140px; height: 140px; image-rendering: pixelated; border-radius: 12px; }
.benefits { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.benefits li { display: flex; gap: 12px; align-items: flex-start; }
.benefits svg { width: 26px; height: 26px; color: var(--plus); flex: none; }

  const onTime = date => { const d = S.daily[date] || {}; return ['mini', 'pic', 'sudoku'].some(s => d[s] === 'ontime'); };
  function regionWeekStart() {
    const tag = navigator.language || 'en';
    try { const l = new Intl.Locale(tag), w = l.getWeekInfo ? l.getWeekInfo() : l.weekInfo; if (w && w.firstDay) return w.firstDay % 7; } catch (e) { /* older engines */ }
    return /-(US|CA|JP|BR|MX|IL|PH|KR|TW|IN)$/i.test(tag) || /^ja/i.test(tag) ? 0 : 1;
  }
  const weekStart = () => (S.weekStart === 'sun' ? 0 : S.weekStart === 'mon' ? 1 : regionWeekStart());
  const weekOf = k => addDays(k, -((fromKey(k).getDay() - weekStart() + 7) % 7));
  function streakInfo() {
    const allow = plusOn() ? 2 : 1, used = {}, rest = new Set();
    let k = todayKey();
    if (!onTime(k)) k = addDays(k, -1);
    let n = 0;
    for (;;) {
      if (onTime(k)) { n++; k = addDays(k, -1); continue; }
      const prev = addDays(k, -1), w = weekOf(k);
      if (!onTime(prev) || (used[w] || 0) >= allow) break;
      used[w] = (used[w] || 0) + 1; rest.add(k); k = prev;

    return { n, rest };
  }
  function streak() {

  /* ---------- games ---------- */
  function makeSudoku(key, diff, seed, extra) {

      time: 0, mistakes: 0, hints: 0, done: false,
    }, extra);

  }
  function openFreeSigns(n, fresh) {

    S.games[key] = Object.assign({

  function picGrid(def) {
    if (def.pic) { const p = PP.pictures.find(x => x.id === def.pic); return { grid: PP.nonogram.parse(p.rows), color: p.color, name: p.name, id: p.id }; }
    const tones = ['#2f6f6a', '#3a6fb5', '#b0533c', '#7a4fb0', '#c08a1e', '#3f8a5a', '#c2416b'];
    return { grid: PP.nonogram.pattern(def.pattern, def.size), color: tones[PP.hash(def.pattern) % tones.length], name: null, id: null };

  /* ---------- Today ---------- */
  function progressOf(g) {
    if (!g) return 0;
    if (g.done) return 1;
    if (g.kind === 'stars') return g.marks.filter((m, k) => m === 1 && g.solution[k]).length / g.n;
    if (g.kind === 'bridges') { const all = g.solution.reduce((a, b) => a + b, 0); return g.bridges.reduce((a, v, e) => a + Math.min(v, g.solution[e]), 0) / all; }
    if (g.kind !== 'pic') { const empty = g.puzzle.filter(v => !v).length; return empty ? g.values.filter((v, i) => v && v === g.solution[i]).length / empty : 0; }
    const need = g.solution.flat().filter(Boolean).length;
    const sol = g.solution.flat();
    return g.marks.flat().filter((m, i) => (m === 1 || m === 3) && sol[i]).length / need;
  }
  function renderToday() {
    const date = todayKey(), items = dailyItems(date), st = streak(), done = dayDone(date);

  /* ---------- Picture Logic play ---------- */
  let mode = 1, picHint = null, cl = null, cur = null;

  const cellEl = (r, c) => document.querySelector(`#pg .pcell[data-r="${r}"][data-c="${c}"]`);
  function drawPic2() {

      let r = +el.dataset.r, c = +el.dataset.c;
      if (r === stroke.r0 && c === stroke.c0) return;
      if (!stroke.axis) stroke.axis = Math.abs(r - stroke.r0) >= Math.abs(c - stroke.c0) ? 'col' : 'row';
      if (stroke.axis === 'row') r = stroke.r0; else c = stroke.c0;
      const steps = Math.max(Math.abs(r - stroke.r0), Math.abs(c - stroke.c0));
      for (let k = 1; k <= steps; k++) {
        const rr = stroke.r0 + Math.sign(r - stroke.r0) * (stroke.axis === 'col' ? k : 0);
        const cc = stroke.c0 + Math.sign(c - stroke.c0) * (stroke.axis === 'row' ? k : 0);
        if (!stroke.batch.some(b => b.r === rr && b.c === cc)) apply(rr, cc);
      }
    };
    const end = () => {
      if (!stroke) return;
      if (stroke.batch.length) undoStack.push(stroke.batch);
      stroke = null; save();
      checkPicWin();
    };
    pg.onpointerup = end; pg.onpointercancel = end;
    pg.onpointerleave = e => { if (e.pointerType === 'mouse') end(); };
  }
  function checkPicWin() {
    const n = G.size;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!!G.solution[r][c] !== isFill(G.marks[r][c])) return;
    cur = null;
    const color = G.color;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const el = cellEl(r, c);
      el.classList.remove('x', 'bad', 'cur', 'hint');
      el.classList.add('reveal');
      setTimeout(() => { el.style.background = G.solution[r][c] ? color : 'var(--surface)'; }, (r + c) * 22);
    }
    win();
  }
  function picAct(act, d) {
    if (act === 'mode') {
      mode = +d.m;
      document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', +b.dataset.m === mode));
      return;
    }
    if (act === 'undo') {
      const u = undoStack.pop();
      if (!u) return;
      u.forEach(x => { G.marks[x.r][x.c] = x.m; });
      save(); return drawPic2();
    }
    if (act === 'hint' && !G.done) return askHint(picHintRun);
  }
  function picHintRun() {
    G.hints++;
    const marks = G.marks.map(row => row.map(m => (m === 3 ? 1 : m === 4 ? 2 : m)));
    const h = PP.nonogram.hint(cl, G.solution, marks);
    if (!h) return;
    if (h.type === 'wrong') {
      picHint = { cells: [{ r: h.r, c: h.c }] };
      setMsg(t('hintPicWrong'), t('erase'), () => { G.marks[h.r][h.c] = 0; picHint = null; setMsg(''); save(); drawPic2(); });
    } else if (h.type === 'line') {
      const cells = h.cells.map(x => (h.kind === 'row' ? { r: h.i, c: x.j, v: x.v } : { r: x.j, c: h.i, v: x.v }));
      picHint = { kind: h.kind, i: h.i, cells };
      setMsg(t(h.kind === 'row' ? 'hintPicRow' : 'hintPicCol', { i: h.i + 1 }), t('apply'), () => {
        undoStack.push(cells.map(x => ({ r: x.r, c: x.c, m: G.marks[x.r][x.c] })));
        cells.forEach(x => { G.marks[x.r][x.c] = x.v ? 1 : 2; });
        picHint = null; setMsg(''); save(); drawPic2(); checkPicWin();
      });
    } else {
      picHint = { cells: [{ r: h.r, c: h.c }] };
      G.marks[h.r][h.c] = h.v ? 1 : 2;
      setMsg(t('hintReveal'));
      checkPicWin();
    }
    save(); drawPic2();
  }

  /* ---------- Bridges play ---------- */
  let bSel = -1, bHint = null, BP = null;
  function mountBridges() {
    BP = Object.assign({ w: G.n, h: G.n, islands: G.islands }, PP.bridges.edgesOf(G.n, G.n, G.islands));
    bSel = -1; bHint = null;
    document.onkeydown = null;
    const W = Math.min(window.innerWidth - 32, 528);
    $('gbody').innerHTML = `
      <div class="bwrap" style="display:grid;place-items:center"><svg class="bboard" id="bb" viewBox="-0.5 -0.5 ${G.n} ${G.n}" style="width:${W}px;height:${W}px" role="img" aria-label="${esc(t('bridges'))}"></svg></div>
      <div class="msg empty" id="msg"></div>
      <div class="tools" style="grid-template-columns:repeat(2,1fr)">
        <button class="tool" data-gact="undo">${ic.undo}${t('undo')}</button>
        <button class="tool" data-gact="hint">${ic.bulb}${t('hint')}<span class="cnt" id="hintCnt"></span></button>
      </div>`;
    const svg = $('bb');
    svg.onpointerdown = e => {
      if (G.done) return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 0.7;
      G.islands.forEach((s, i) => { const d = Math.hypot(s.c - p.x, s.r - p.y); if (d < bd) { bd = d; best = i; } });
      if (best >= 0) return tapIsland(best);
      const e2 = BP.edges.findIndex(x => {
        const a = G.islands[x.a], b = G.islands[x.b];
        return x.dir === 'h' ? Math.abs(p.y - a.r) < 0.35 && p.x > a.c && p.x < b.c : Math.abs(p.x - a.c) < 0.35 && p.y > a.r && p.y < b.r;
      });
      if (e2 >= 0) { bSel = -1; return cycleEdge(e2); }
      bSel = -1; drawBridges();
    };
    drawBridges();
  }
  const edgeBetween = (a, b) => BP.edges.findIndex(x => (x.a === a && x.b === b) || (x.a === b && x.b === a));
  function tapIsland(i) {
    bHint = null; setMsg('');
    if (bSel >= 0 && bSel !== i) {
      const e = edgeBetween(bSel, i);
      if (e >= 0) return cycleEdge(e);
    }
    bSel = bSel === i ? -1 : i;
    beep(640, 0.02, 0.02); drawBridges();
  }
  function cycleEdge(e) {
    const next = (G.bridges[e] + 1) % 3;
    if (next && BP.cross[e].some(x => G.bridges[x])) { buzz(30); setMsg(t('bridgesCross')); return; }
    setEdge(e, next);
  }
  function setEdge(e, v) {
    undoStack.push([{ e, v: G.bridges[e] }]);
    G.bridges[e] = v;
    if (S.check && v > G.solution[e]) { G.mistakes++; buzz(60); beep(220, 0.12, 0.05); }
    else if (v) { beep(520 + v * 60, 0.04); buzz(8); }
    bHint = null; save(); drawBridges();
    if (G.bridges.every((x, k) => x === G.solution[k])) { bSel = -1; drawBridges(true); win(); }
  }
  function drawBridges(solved) {
    const svg = $('bb'); if (!svg) return;
    const have = G.islands.map((_, i) => BP.by[i].reduce((a, e) => a + G.bridges[e], 0));
    const near = new Set(bSel >= 0 ? BP.by[bSel].map(e => (BP.edges[e].a === bSel ? BP.edges[e].b : BP.edges[e].a)) : []);
    let h = '';
    if (bSel >= 0) BP.by[bSel].forEach(e => {
      const a = G.islands[BP.edges[e].a], b = G.islands[BP.edges[e].b];
      h += `<line class="bguide" x1="${a.c}" y1="${a.r}" x2="${b.c}" y2="${b.r}"/>`;
    });
    BP.edges.forEach((x, e) => {
      const v = G.bridges[e]; if (!v) return;
      const a = G.islands[x.a], b = G.islands[x.b], bad = S.check && v > G.solution[e], hl = bHint && bHint.e === e;
      const cls = 'bline' + (bad ? ' bad' : '') + (hl ? ' hint' : '');
      const off = v === 2 ? [-0.11, 0.11] : [0];
      off.forEach(o => {
        h += x.dir === 'h' ? `<line class="${cls}" x1="${a.c}" y1="${a.r + o}" x2="${b.c}" y2="${b.r + o}"/>` : `<line class="${cls}" x1="${a.c + o}" y1="${a.r}" x2="${b.c + o}" y2="${b.r}"/>`;
      });
    });
    if (bHint && bHint.type !== 'wrong' && !G.bridges[bHint.e]) {
      const x = BP.edges[bHint.e], a = G.islands[x.a], b = G.islands[x.b];
      h += `<line class="bguide hint" x1="${a.c}" y1="${a.r}" x2="${b.c}" y2="${b.r}"/>`;
    }
    G.islands.forEach((s, i) => {
      const st = have[i] === s.n ? 'full' : have[i] > s.n && S.check ? 'over' : '';
      const cls = ['isl', st, i === bSel ? 'sel' : '', near.has(i) ? 'near' : '', bHint && bHint.island === i ? 'hint' : '', solved ? 'won' : ''].join(' ');
      h += `<g class="${cls}" style="${solved ? `animation-delay:${(s.r + s.c) * 30}ms` : ''}"><circle cx="${s.c}" cy="${s.r}" r="0.4"/><text x="${s.c}" y="${s.r}" dy="0.36em">${s.n}</text></g>`;
    });
    svg.innerHTML = h;
    const hc = $('hintCnt'), left = hintsLeft();
    hc.textContent = left === Infinity ? '∞' : left || '▶';
    hc.classList.toggle('ad', left === 0);
    if (STORE && left === Infinity) hc.classList.add('hidden');
  }
  function bridgesAct(act) {
    if (act === 'undo') {
      const u = undoStack.pop();
      if (!u) return;
      u.forEach(x => { G.bridges[x.e] = x.v; });
      bHint = null; setMsg(''); save(); return drawBridges();
    }
    if (act === 'hint' && !G.done) return askHint(bridgesHint);
  }
  function bridgesHint() {
    G.hints++;
    const h = PP.bridges.hint(BP, G.bridges, G.solution);
    if (!h) return;
    bHint = h; bSel = -1;
    if (h.type === 'wrong') {
      setMsg(t('hintBridgesWrong'), t('erase'), () => { setMsg(''); setEdge(h.e, G.solution[h.e]); });
    } else {
      const isl = h.type === 'island' ? G.islands[h.island] : null;
      const msg = isl ? t(h.deep ? 'hintBridgesDeep' : 'hintBridges', { v: isl.n }) : t('hintReveal');
      setMsg(msg, t('apply'), () => { setMsg(''); setEdge(h.e, h.value); });
    }
    save(); drawBridges();
  }

  /* ---------- Stars play ---------- */
  let sMode = 1, sHint = null;
  const AREA_HUES = [32, 200, 120, 280, 0, 170, 55, 330, 240];
  function mountStars() {
    const n = G.n; sMode = 1; sHint = null; document.onkeydown = null;
    const W = Math.min(window.innerWidth - 32, 528);
    const reg = G.regions;
    const cells = reg.map((g, k) => {
      const r = Math.floor(k / n), c = k % n;
      const bw = (dr, dc) => { const rr = r + dr, cc = c + dc; return rr < 0 || cc < 0 || rr >= n || cc >= n ? 0 : reg[rr * n + cc] !== g ? 3 : 1; };
      return `<div class="stc" data-k="${k}" style="background:color-mix(in srgb, hsl(${AREA_HUES[g]} 65% 55%) 24%, var(--surface));border-top-width:${bw(-1, 0)}px;border-left-width:${bw(0, -1)}px"></div>`;
    }).join('');
    $('gbody').innerHTML = `
      <div class="bwrap" style="display:grid;place-items:center"><div class="stboard" id="stb" style="width:${W}px;height:${W}px;grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr);font-size:${Math.round(W / n * 0.5)}px">${cells}</div></div>
      <div class="msg empty" id="msg"></div>
      <div class="modes"><button class="mode on" data-gact="smode" data-m="1"><span class="sw star">★</span>${t('starMode')}</button><button class="mode" data-gact="smode" data-m="2"><span class="sw dotm"></span>${t('cross')}</button></div>
      <div class="tools" style="grid-template-columns:repeat(2,1fr)">
        <button class="tool" data-gact="undo">${ic.undo}${t('undo')}</button>
        <button class="tool" data-gact="hint">${ic.bulb}${t('hint')}<span class="cnt" id="hintCnt"></span></button>
      </div>`;
    $('stb').onpointerdown = e => {
      const el = e.target.closest('.stc'); if (!el || G.done) return;
      e.preventDefault(); tapStar(+el.dataset.k);
    };
    drawStars();
  }
  function blockedBy(n, marks, regions) {
    const out = new Set();
    marks.forEach((m, k) => {
      if (m !== 1) return;
      const r = Math.floor(k / n), c = k % n;
      for (let x = 0; x < n * n; x++) {
        const rr = Math.floor(x / n), cc = x % n;
        if (x !== k && (rr === r || cc === c || regions[x] === regions[k] || (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1))) out.add(x);
      }
    });
    return out;
  }
  function tapStar(k) {
    const m = G.marks[k], v = sMode === 1 ? (m === 1 ? 0 : 1) : (m === 2 ? 0 : m === 1 ? 1 : 2);
    if (v === m) return;
    setStar([{ k, v }]);
  }
  function setStar(list) {
    undoStack.push(list.map(x => ({ k: x.k, m: G.marks[x.k] })));
    let bad = false;
    list.forEach(x => { G.marks[x.k] = x.v; if (S.check && ((x.v === 1 && !G.solution[x.k]) || (x.v === 2 && G.solution[x.k]))) bad = true; });
    if (bad) { G.mistakes++; buzz(60); beep(220, 0.12, 0.05); } else if (list.some(x => x.v === 1)) { beep(660, 0.05); buzz(8); } else beep(500, 0.02, 0.02);
    sHint = null; save(); drawStars();
    if (G.solution.every((s, k) => !!s === (G.marks[k] === 1))) {
      document.querySelectorAll('#stb .stc').forEach(el => { const k = +el.dataset.k; el.style.animationDelay = ((k % G.n) + Math.floor(k / G.n)) * 30 + 'ms'; el.classList.add('wave'); });
      win();
    }
  }
  function drawStars() {
    const n = G.n, blocked = blockedBy(n, G.marks, G.regions);
    const hintCells = sHint ? new Set(sHint.cells || (sHint.unit ? sHint.unit.cells : [sHint.cell])) : null;
    document.querySelectorAll('#stb .stc').forEach(el => {
      const k = +el.dataset.k, m = G.marks[k];
      const bad = S.check && ((m === 1 && !G.solution[k]) || (m === 2 && G.solution[k]));
      el.textContent = m === 1 ? '★' : '';
      el.classList.toggle('star', m === 1);
      el.classList.toggle('mark', m === 2);
      el.classList.toggle('auto', !m && blocked.has(k));
      el.classList.toggle('bad', !!bad);
      el.classList.toggle('hint', !!sHint && sHint.cell === k);
      el.classList.toggle('hunit', !!hintCells && hintCells.has(k) && sHint.cell !== k);
    });
    const hc = $('hintCnt'), left = hintsLeft();
    hc.textContent = left === Infinity ? '∞' : left || '▶';
    hc.classList.toggle('ad', left === 0);
    if (STORE && left === Infinity) hc.classList.add('hidden');
  }
  function starsAct(act, d) {
    if (act === 'smode') { sMode = +d.m; document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', +b.dataset.m === sMode)); return; }
    if (act === 'undo') {
      const u = undoStack.pop(); if (!u) return;
      u.forEach(x => { G.marks[x.k] = x.m; });
      sHint = null; setMsg(''); save(); return drawStars();
    }
    if (act === 'hint' && !G.done) return askHint(starsHint);
  }
  function starsHint() {
    G.hints++;
    const blocked = blockedBy(G.n, G.marks, G.regions);
    const cur = G.marks.map((m, k) => m || (blocked.has(k) ? 2 : 0));
    const h = PP.stars.hint(G.n, G.regions, G.solution, cur);
    if (!h) return;
    sHint = h;
    if (h.type === 'wrong') setMsg(t('hintStarsWrong'), t('erase'), () => { setMsg(''); setStar([{ k: h.cell, v: 0 }]); });
    else if (h.type === 'star') {
      const unit = h.unit ? t({ row: 'unitRow', col: 'unitCol', area: 'unitArea' }[h.unit.kind]) : '';
      setMsg(t('hintStarsStar', { u: unit }), t('apply'), () => { setMsg(''); setStar([{ k: h.cell, v: 1 }]); });
    } else setMsg(t(h.type === 'deep' ? 'hintStarsDeep' : 'hintStarsEmpty'), t('apply'), () => { setMsg(''); setStar(h.cells.map(k => ({ k, v: 2 }))); });
    save(); drawStars();
  }

  /* ---------- start ---------- */
  if (!STORE || window.PP_SHOTS) window.PPdebug = { state: () => S, set: o => { S = Object.assign(defaults(), o); save(); go({ tab: 'today' }); } };
  window.addEventListener('resize', () => { if (view.game && G && G.kind === 'pic') mountPic(); else if (view.game && G && G.kind === 'bridges') mountBridges(); else if (view.game && G && G.kind === 'stars') mountStars();  if (view.game && G && G.kind !== 'pic') fitBoard(); });
  const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (CapApp) CapApp.addListener('backButton', () => {
    if ($('veil')) return closeSheet();
    if (view.game) {
      if (G && G.done) return gameAct('back');
      return sheet(`<h2>${t('leaveTitle')}</h2><p>${t('leaveText')}</p>
        <div class="try-b"><button class="btn ghost" data-sact="leave">${t('leaveGo')}</button><button class="btn" data-sact="close">${t('leaveStay')}</button></div>`, { leave: () => { closeSheet(); gameAct('back'); } });
    }
    if (view.tab !== 'today') return go({ tab: 'today' });
    sheet(`<h2>${t('exitTitle')}</h2><p>${t('exitText')}</p>
      <div class="try-b"><button class="btn ghost" data-sact="leave">${t('exitGo')}</button><button class="btn" data-sact="close">${t('exitStay')}</button></div>`, { leave: () => CapApp.exitApp() });
  });
  render();
  scheduleReminder();
  startMoney();
})();

</script>
</body>
</html>
