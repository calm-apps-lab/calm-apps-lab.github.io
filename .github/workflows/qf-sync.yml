# Twice-weekly Quran Foundation sync for Quran Nest: refreshes dn/qf-audio.json (audio URLs and word timings only,
# no audio files). Needs repository secrets QF_CLIENT_ID and QF_CLIENT_SECRET from dev-console.quran.foundation.
name: Quran Foundation sync (Quran Nest)

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Only list which recitation resources Quran Foundation offers (no file is written)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch recitation data
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: ${{ vars.QF_ENV }}
          QF_DISCOVER: ${{ inputs.discover && '1' || '' }}
          QF_RECITATION: ${{ vars.QF_RECITATION }}
        run: node tools/qf_sync.js dn/qf-audio.json
      - name: Commit
        if: ${{ !inputs.discover }}
        run: |
          git config user.name "calm-apps-lab"
          git config user.email "calm-apps-lab@users.noreply.github.com"
          git add dn/qf-audio.json
          git commit -m "Weekly Quran Foundation sync" || echo "nothing changed"
          git push
