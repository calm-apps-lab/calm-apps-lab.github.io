<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27306a"/><stop offset="1" stop-color="#151a3a"/>
    </linearGradient>
    <clipPath id="sea"><rect x="0" y="0" width="512" height="300"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- a low moon settling on still water -->
  <circle cx="256" cy="292" r="118" fill="#f2c27a" clip-path="url(#sea)"/>
  <!-- calm water: three soft lines, shorter as they fade -->
  <g stroke-linecap="round" fill="none">
    <path d="M112 330h288" stroke="#f2c27a" stroke-width="22"/>
    <path d="M160 378h192" stroke="#f2c27a" stroke-width="22" opacity=".6"/>
    <path d="M212 424h88" stroke="#f2c27a" stroke-width="22" opacity=".3"/>
  </g>
  <circle cx="378" cy="138" r="10" fill="#fbf3df"/>
  <circle cx="140" cy="168" r="7" fill="#fbf3df" opacity=".8"/>
</svg>
